# Copie para .github/workflows/ci.yml. Não foi executado ainda: valide no primeiro projeto.
# Pré-requisito: package-lock.json commitado e scripts "lint", "test" e "build" no package.json.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (versões travadas)
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Testes
        run: npm test

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
