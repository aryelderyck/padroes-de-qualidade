# Copie para .github/workflows/ci.yml. Não foi executado ainda: valide no primeiro projeto.
# Pré-requisito: package-lock.json commitado e scripts "conferir" e "build" no package.json.
# "conferir": "prettier --check . && eslint . --max-warnings 0 && tsc --noEmit && vitest run"  (PADROES.md, seção 4A)
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências (versões travadas)
        run: npm ci

      - name: Conferência completa (formatação, linter, tipos e testes)
        run: npm run conferir

      - name: Auditoria de dependências
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build
