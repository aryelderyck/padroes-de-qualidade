# Copie para .github/workflows/ci.yml. Não foi executado ainda: valide no primeiro projeto.
# Antes: gere requirements-dev.txt travado, por exemplo com
#   pip install pip-tools && pip-compile pyproject.toml --extra dev -o requirements-dev.txt
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências (versões travadas)
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      # As quatro etapas abaixo são as mesmas do conferir.py (PADROES.md, seção 4A), com cobertura nos testes.
      - name: Formatação e indentação
        run: ruff format --check .

      - name: Linter (Código Limpo com limite e regras de segurança)
        run: ruff check .

      - name: Tipos
        run: mypy .

      - name: Testes com cobertura mínima
        run: pytest --cov --cov-fail-under=80

      - name: Auditoria de dependências
        run: pip-audit -r requirements-dev.txt

