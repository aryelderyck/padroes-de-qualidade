# Copie para .github/workflows/ci.yml. As etapas "run" deste arquivo são executadas nas provas do kit,
# num ambiente virtual de verdade, em Linux e em Windows.
# Nível 2 em diante: trave as versões (pip-compile ou uv) e instale a partir do arquivo travado.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  qualidade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar o projeto e as ferramentas da conferência
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      # As quatro etapas abaixo são as mesmas do conferir.py (PADROES.md, seção 4A), com cobertura nos testes.
      - name: Formatação e indentação
        run: ruff format --check .

      - name: Linter (Código Limpo com limite e regras de segurança)
        run: ruff check .

      - name: Tipos
        run: mypy .

      - name: Testes com cobertura mínima
        run: pytest --cov --cov-fail-under=80

      - name: Auditoria de dependências
        run: pip-audit --skip-editable

  # Descomente quando o projeto tiver Dockerfile. Confira a versão atual da action do Trivy.
