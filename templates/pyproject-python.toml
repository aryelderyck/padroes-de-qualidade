# Modelo de pyproject.toml para projetos Python do kit.
# Troque o nome, liste as dependências e, se a pasta do código não se chamar `app`, troque `app`
# nos dois lugares marcados com "pasta do código".

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nome-do-projeto"
version = "0.1.0"
requires-python = ">=3.12"
# O que o projeto usa para rodar. Exemplos: "fastapi", "uvicorn[standard]", "pydantic>=2", "httpx".
dependencies = []

[project.optional-dependencies]
# Ferramentas da conferência. Instale com: pip install -e ".[dev]"
dev = [
  "pytest",
  "pytest-cov",
  "ruff",
  "mypy",
  "pip-audit",
]

[tool.setuptools.packages.find]
# Pasta do código. Sem esta lista, o pip recusa instalar um projeto com mais de uma pasta na raiz.
include = ["app*"]

# ---------------------------------------------------------------------------
# Conferência de código (PADROES.md, seção 4A). Cada regra abaixo tem prova em
# provas/ no kit: um exemplo ruim que ela pega e um bom que ela deixa passar.
# ---------------------------------------------------------------------------

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Indentação e formatação não se discutem: quem decide é o formatador.
indent-style = "space"     # 4 espaços (PEP 8)
quote-style = "double"
line-ending = "lf"

[tool.ruff.lint]
select = [
  "E", "W", "F",   # erros de sintaxe e de uso: variável não usada, comparação com None
  "I",             # ordem dos imports
  "N",             # nomes no padrão da linguagem
  "UP",            # Python moderno
  "B",             # armadilhas: valor padrão mutável, variável de laço em closure
  "A",             # nome que esconde função embutida (list, id, type)
  "C4", "SIM", "RET", "PERF",  # o mesmo resultado com menos código e menos custo
  "C90", "PL",     # Código Limpo com limite: complexidade, parâmetros, tamanho, número mágico
  "ARG",           # parâmetro não usado
  "ERA",           # código comentado
  "BLE",           # except genérico que engole o erro
  "DTZ",           # data e hora sem fuso
  "T20",           # print esquecido
  "PT",            # testes no padrão do pytest
  "S",             # segurança: SQL montado com texto, senha no código, chamada sem tempo limite
  "RUF",
]

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.pylint]
max-args = 5
max-branches = 12
max-returns = 6
max-statements = 40
# Aninhamento: a regra do ruff (PLR1702) ainda é experimental; a complexidade (C901) cobre por ora.

[tool.ruff.lint.per-file-ignores]
# Em testes são normais: assert, número de exemplo, fixture usada só pelo efeito e senha de mentira.
"tests/**" = ["S101", "PLR2004", "ARG001", "S105", "S106"]
"conferir.py" = ["T201", "S603"]            # script de terminal: imprime e chama as ferramentas
".claude/**" = ["S603"]                     # ganchos do Claude Code chamam o formatador e o linter

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
# Teste não precisa de anotação de tipo em cada função; o código de produção precisa.
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
disallow_untyped_decorators = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app"]   # pasta do código

[tool.coverage.report]
fail_under = 80
show_missing = true
