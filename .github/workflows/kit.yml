# CI do próprio kit: roda as provas a cada envio, em Linux e em Windows.
# Regra automática sem prova não entra. As versões fixadas são as usadas para escrever as provas.
name: Provas do kit

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  provas:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    env:
      PROVAS_COM_REDE: "1"
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22

      - name: Instalar as ferramentas conferidas
        run: |
          python -m pip install --upgrade pip
          pip install "ruff==0.16.9" "mypy==2.3.1" "pytest==9.1.1" pyyaml
          npm install --global "eslint@10.1.0" "prettier@3.8.1"

      - name: Rodar as provas
        run: python provas/conferir-provas.py
